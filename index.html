<style>
/* Layout: one-column phone app shell, sticky month header, fixed bottom tab bar, bottom sheets for input */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#E2E8E4; --fg:#13201A; --muted:#5A6A62; --line:#D2DBD6;
  --accent:#0F6B57; --accent-fg:#FFFFFF; --accent-soft:#D4E9E1;
  --income:#1D7A3B; --expense:#B4451F; --warn:#A86A12; --danger:#B42318;
  --f-display:'Roboto',system-ui,-apple-system,sans-serif;
  --f-body:'Roboto Condensed','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1411; --surface:#151F1B; --surface-2:#1E2A25; --fg:#E5EEE9; --muted:#93A59C; --line:#2A3832;
  --accent:#52C4A2; --accent-fg:#05231A; --accent-soft:#163A30;
  --income:#5CC27B; --expense:#F08A62; --warn:#E2AE4A; --danger:#F07167; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1411; --surface:#151F1B; --surface-2:#1E2A25; --fg:#E5EEE9; --muted:#93A59C; --line:#2A3832;
  --accent:#52C4A2; --accent-fg:#05231A; --accent-soft:#163A30;
  --income:#5CC27B; --expense:#F08A62; --warn:#E2AE4A; --danger:#F07167; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-style:normal;font-size:14px}
.sync{border:0;background:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--muted)}
.sync svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sync[data-s="ok"]{color:var(--accent)}
.sync[data-s="busy"] svg{animation:pulse 1s ease-in-out infinite alternate}
.sync[data-s="off"]{color:var(--warn)}
.sync[data-s="auth"]{color:var(--danger)}
@keyframes pulse{to{opacity:.3}}
.bell{position:relative}
.bell b{position:absolute;top:0;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:var(--surface);font:700 10px/16px var(--f-body);text-align:center}
@media (max-width:400px){.brand .bt{display:none}}
.nt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none}
.nt:last-child{border-bottom:0}
.nt .dot{margin-top:5px}
.nt span{display:flex;flex-direction:column;gap:2px;min-width:0}
.nt small{color:var(--muted);font-size:12px}
.nt.new b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:middle}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.month button:hover{background:var(--surface-2)}
.month span{font-weight:700;font-size:13px;min-width:112px;text-align:center}
main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
h2{font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:4px}
.hero{background:var(--accent);color:var(--accent-fg);border:0}
.hero .lbl{font-size:13px;opacity:.8;font-weight:600}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,38px);letter-spacing:-.02em;margin:2px 0 12px;overflow-wrap:anywhere}
.accs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.accs::-webkit-scrollbar{display:none}
.acc{flex:0 0 auto;background:color-mix(in srgb,var(--accent-fg) 14%,transparent);border-radius:10px;padding:8px 12px;border:0;text-align:left;color:inherit}
.acc small{display:block;font-size:12px;opacity:.8}
.acc b{font-size:14px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{min-width:0}
.trio small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.trio b{display:block;font-size:15px;overflow-wrap:anywhere}
.inc{color:var(--income)}.exp{color:var(--expense)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.note b{color:var(--fg)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:13px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.dng{background:none;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.full{width:100%}
.bud{display:flex;flex-direction:column;gap:12px}
.bud-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;border:0;background:none;text-align:left;padding:0;width:100%}
.bud-row .nm{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.bud-row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bud-row .amt{font-size:13px;color:var(--muted)}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn i{background:var(--warn)}.bar.over i{background:var(--danger)}
.bud-row .st{grid-column:1/-1;font-size:12px;color:var(--muted)}
.bud-row .st.over{color:var(--danger);font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.list{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.list .tx:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff}
.tx .t{min-width:0}
.tx .t b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:14px 2px 2px;text-transform:none}
.empty{color:var(--muted);text-align:center;padding:28px 8px;font-size:14px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:420px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:150px;height:150px}
.donut .c1{fill:var(--muted);font-size:9px;font-family:var(--f-body);font-weight:600}
.donut .c2{fill:var(--fg);font-size:13px;font-family:var(--f-body);font-weight:800}
.legend{display:flex;flex-direction:column;gap:8px;width:100%;min-width:0}
.legend div{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:13px}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;color:var(--muted);font-size:12px;min-width:34px;text-align:right}
.chart{width:100%;height:auto;display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .lb{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .lb.cur{fill:var(--fg);font-weight:800}
.chart .bi{fill:var(--income)}.chart .be{fill:var(--expense)}
.keys{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.rows .row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:10px;min-width:0}
.row .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--muted);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;border-radius:10px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;z-index:26;right:max(18px,calc(50vw - 262px));right:max(18px,calc(50vw - 262px),calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);font-size:30px;line-height:1;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
#scrim{position:fixed;inset:0;z-index:40;background:rgba(5,15,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0 0 14px}
.form{display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:15px;font-weight:600;color:var(--fg)}
.amt-inp{font-family:var(--f-display);font-size:28px;font-weight:700;padding:12px;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em;margin:0}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--fg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;max-width:calc(100% - 32px)}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.qk{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;text-align:left;min-width:0}
.qk:hover{border-color:var(--accent)}
.qk span{min-width:0;display:flex;flex-direction:column}
.qk b{font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qk small{font-size:12px;color:var(--muted);font-weight:600}
.check{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 auto}
.check span{display:flex;flex-direction:column;flex:1;min-width:0}
.check b{font-size:14px}.check small{font-size:12px;color:var(--muted)}
.st b{font-weight:800}
.sheet-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sms-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent-soft);color:var(--accent)}
.sms-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.sms-ta{min-height:150px;font-family:var(--f-body)!important;font-size:14px!important}
.sms-it{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.sms-it.dup{border-style:dashed}
.sms-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sms-top input{width:20px;height:20px;accent-color:var(--accent)}
.sms-amt{font-family:var(--f-display);font-weight:700;font-size:20px}
.sms-top em{font-style:normal;font-size:12px;font-weight:700;color:var(--warn)}
.sms-it details{font-size:12px;color:var(--muted)}
.sms-it details p{margin:6px 0 0;overflow-wrap:anywhere}
.sms-it summary{cursor:pointer;font-weight:700}
textarea.inp{min-height:120px;font-family:var(--f-body);font-size:12px;font-weight:400}
#lockscreen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(40px,env(safe-area-inset-top,16px)) 24px max(40px,env(safe-area-inset-bottom,16px))}
.lk-brand{font-family:var(--f-display);font-weight:700;font-size:22px;display:flex;align-items:center;gap:10px}
.lk-brand i{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-style:normal;font-size:20px}
.lk-dots{display:flex;gap:16px}
.lk-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);transition:.15s}
.lk-dot.on{background:var(--accent);border-color:var(--accent)}
.lk-dot.err{background:var(--danger);border-color:var(--danger)}
.lk-msg{font-size:13px;font-weight:600;color:var(--muted);min-height:1.3em;text-align:center}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(288px,100%)}
.lk-key{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:700;font-family:var(--f-display);touch-action:manipulation}
.lk-key:active,.lk-key:focus-visible{background:var(--surface-2)}
.lk-ph{background:none!important;border-color:transparent!important;pointer-events:none}
@keyframes lk-shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.lk-shake{animation:lk-shake .3s ease}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i>₮</i><span class="bt">Төгрөг</span><button class="sync" id="sync" data-act="sync-now" hidden><svg viewBox="0 0 24 24"><path d="M7 18.5a4.5 4.5 0 0 1-.7-8.95A6 6 0 0 1 17.8 8.6 4.2 4.2 0 0 1 17.5 18.5z"/></svg></button><button class="sync bell" id="bell" data-act="notif" aria-label="Мэдэгдэл"><svg viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><b id="bell-n" hidden></b></button></div>
    <div class="month" id="month">
      <button data-act="m-prev" aria-label="Өмнөх сар">‹</button>
      <span id="m-label" class="num"></span>
      <button data-act="m-next" aria-label="Дараах сар">›</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<button class="fab" data-act="tx-new" aria-label="Гүйлгээ нэмэх">+</button>

<nav class="tabs" aria-label="Цэс"><div>
  <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Нүүр</a>
  <a href="#txs" data-tab="txs"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Гүйлгээ</a>
  <a href="#budget" data-tab="budget"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M15.5 15h2.5M7 3h10"/></svg>Төсөв</a>
  <a href="#report" data-tab="report"><svg viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-7M2 20h20"/></svg>Тайлан</a>
  <a href="#prefs" data-tab="prefs"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M2.5 12h3M18.5 12h3M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>Тохиргоо</a>
</div></nav>

<div id="scrim" hidden><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet"></div></div></div>

<script>
(async function(){
'use strict';
const KEY='togrog.finance.v1';
const COLORS=['#2F855A','#C05621','#2B6CB0','#B83280','#6B46C1','#0987A0','#B7791F','#C53030','#4A5568','#38A169','#D69E2E','#805AD5','#DD6B20','#319795','#718096'];
const WD=['Ням','Даваа','Мягмар','Лхагва','Пүрэв','Баасан','Бямба'];
const ACC_TYPES={cash:'Бэлэн мөнгө',bank:'Банкны данс',card:'Кредит карт',saving:'Хадгаламж'};
/* Banks licensed in Mongolia. key = lowercase fragment matched in account names, rx = how the bank appears in its SMS */
const BANK_LIST=[
  {id:'khan',name:'Хаан банк',short:'Хаан',key:'хаан',color:'#1D7A3B',rx:/khan|хаан/i},
  {id:'golomt',name:'Голомт банк',short:'Голомт',key:'голомт',color:'#2B6CB0',rx:/golomt|голомт/i},
  {id:'tdb',name:'Худалдаа хөгжлийн банк',short:'ХХБ',key:'худалдаа',color:'#1A4E8A',rx:/tdb|худалдаа хөгжил|hudaldaa|ххб/i},
  {id:'xac',name:'ХасБанк',short:'Хас',key:'хас',color:'#C05621',rx:/xac|хас ?банк|хас /i},
  {id:'state',name:'Төрийн банк',short:'Төрийн',key:'төрийн',color:'#0987A0',rx:/state ?bank|төрийн банк|turiin/i},
  {id:'capitron',name:'Капитрон банк',short:'Капитрон',key:'капитрон',color:'#6B46C1',rx:/capitron|капитрон/i},
  {id:'bogd',name:'Богд банк',short:'Богд',key:'богд',color:'#B7791F',rx:/bogd|богд/i},
  {id:'mbank',name:'М банк',short:'М банк',key:'м банк',color:'#B83280',rx:/m ?bank|м банк/i},
  {id:'arig',name:'Ариг банк',short:'Ариг',key:'ариг',color:'#319795',rx:/arig|ариг/i},
  {id:'nib',name:'Үндэсний хөрөнгө оруулалтын банк',short:'ҮХОБ',key:'үндэсний',color:'#4A5568',rx:/nibank|\bnib\b|үндэсний хөрөнгө|ухоб|үхоб/i},
  {id:'trans',name:'Транс банк',short:'Транс',key:'транс',color:'#805AD5',rx:/trans ?bank|транс банк/i},
  {id:'ckb',name:'Чингис хаан банк',short:'Чингис хаан',key:'чингис',color:'#C53030',rx:/ckbank|\bckb\b|chinggis|чингис хаан/i},
  {id:'credit',name:'Кредит банк',short:'Кредит',key:'кредит банк',color:'#DD6B20',rx:/credit ?bank|кредит банк/i}];
const bankOf=a=>a&&a.bank?BANK_LIST.find(b=>b.id===a.bank):null;
const bankAccName=(b,type)=>type==='card'?b.short+' карт':type==='saving'?b.short+' хадгаламж':b.name;
const TYPE_LBL={expense:'Зарлага',income:'Орлого',transfer:'Шилжүүлэг'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const grp=n=>Math.round(Math.abs(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const fmt=n=>(n<0?'−':'')+grp(n)+'₮';
const compact=n=>n>=1e6?(+(n/1e6).toFixed(1))+' сая':n>=1e3?Math.round(n/1e3)+' мян':String(Math.round(n));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const ym=d=>d.slice(0,7);
const shiftM=(m,k)=>{let[y,mo]=m.split('-').map(Number);mo+=k;while(mo<1){mo+=12;y--}while(mo>12){mo-=12;y++}return y+'-'+String(mo).padStart(2,'0')};
const mLabel=m=>m.slice(0,4)+' оны '+Number(m.slice(5))+'-р сар';
const dim=m=>new Date(+m.slice(0,4),+m.slice(5),0).getDate();
function dayLabel(d){
  const t=new Date();if(d===iso(t))return 'Өнөөдөр';
  t.setDate(t.getDate()-1);if(d===iso(t))return 'Өчигдөр';
  return Number(d.slice(5,7))+'-р сарын '+Number(d.slice(8))+', '+WD[new Date(d+'T00:00').getDay()];
}
const parseAmt=v=>Number(String(v).replace(/[^\d]/g,''))||0;

/* ---------- data ---------- */
/* Loan categories: tx in them carry `who` (person). loan:'out' = lent, 'in' = paid back */
const LOAN_CATS=()=>[{id:'e15',name:'Зээл өгсөн',kind:'expense',color:'#9C4221',loan:'out'},{id:'i5',name:'Зээл буцаан авсан',kind:'income',color:'#2C7A7B',loan:'in'}];
function defaults(){
  const ex=['Хоол хүнс','Кафе, ресторан','Тээвэр, такси','Шатахуун','Орон сууц','Ашиглалтын төлбөр','Утас, интернет','Эрүүл мэнд','Хувцас','Боловсрол','Хүүхэд','Зугаа цэнгэл','Спорт','Бэлэг','Бусад зарлага'];
  const inc=['Цалин','Бизнесийн орлого','Нэмэлт орлого','Хүүгийн орлого','Бусад орлого'];
  const cats=ex.map((n,i)=>({id:'e'+i,name:n,kind:'expense',color:COLORS[i%COLORS.length]}))
    .concat(inc.map((n,i)=>({id:'i'+i,name:n,kind:'income',color:['#1D7A3B','#0987A0','#6B46C1','#B7791F','#4A5568'][i]})));
  cats.push(...LOAN_CATS());
  return {v:1,sample:false,loanCats:1,accounts:[
    {id:'a1',name:'Бэлэн мөнгө',type:'cash',initial:0},
    {id:'a2',name:'Харилцах данс',type:'bank',initial:0},
    {id:'a3',name:'Хадгаламж',type:'saving',initial:0}],categories:cats,tx:[],budgets:{},recurring:[],goals:[]};
}
/* Recurring rules → generate a tx for each month whose day has arrived; r.done remembers months already generated (deleting a tx won't bring it back).
   The tx id is rule id + month, so two offline devices generate the same record instead of a duplicate. */
function applyRecurring(st){
  let n=0;const now=today(),cm=ym(now);
  for(const r of st.recurring||[]){
    r.done=r.done||[];let m=r.start,guard=0;
    while(m<=cm&&guard++<240){
      const d=m+'-'+String(Math.min(r.day,dim(m))).padStart(2,'0');
      if(d<=now&&!r.done.includes(m)){st.tx.push({id:r.id+'_'+m,type:r.type,amount:r.amount,date:d,catId:r.catId||null,accId:r.accId,toAccId:r.toAccId||null,note:r.note||'',recId:r.id,ts:Date.now()});r.done.push(m);n++}
      m=shiftM(m,1);
    }
    while(r.start<cm&&r.done.includes(r.start))r.start=shiftM(r.start,1);
    r.done=r.done.filter(x=>x>=r.start);
  }
  return n;
}
const monthsBetween=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5)-+a.slice(5));
function sample(){
  const s=defaults();s.sample=true;
  // cash + current accounts at 2 banks + cards from 2 banks + savings at 3 banks
  s.accounts=[{id:'a1',name:'Бэлэн мөнгө',type:'cash',initial:85000},
    {id:'a2',name:'Хаан банк',type:'bank',bank:'khan',initial:1450000},
    {id:'a3',name:'Голомт банк',type:'bank',bank:'golomt',initial:620000},
    {id:'a4',name:'ХХБ карт',type:'card',bank:'tdb',initial:0},
    {id:'a5',name:'Голомт карт',type:'card',bank:'golomt',initial:0},
    {id:'a6',name:'Хаан хадгаламж',type:'saving',bank:'khan',initial:4800000},
    {id:'a7',name:'Хас хадгаламж',type:'saving',bank:'xac',initial:2500000},
    {id:'a8',name:'Төрийн хадгаламж',type:'saving',bank:'state',initial:1200000}];
  let seed=20261030;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const r=(a,b,step=500)=>Math.round((a+rnd()*(b-a))/step)*step;
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const now=today(),cm=ym(now);
  const add=(m,day,type,amount,catId,accId,note,toAccId)=>{const d=m+'-'+String(Math.min(day,dim(m))).padStart(2,'0');if(d>now)return null;const t={id:uid(),type,amount,date:d,catId:catId||null,accId,toAccId:toAccId||null,note:note||''};s.tx.push(t);return t};
  const day=()=>1+Math.floor(rnd()*28);
  for(let k=2;k>=0;k--){  // last 3 months
    const m=shiftM(cm,-k);
    add(m,19,'income',r(450000,900000,10000),'i2','a3','Гэрээт ажил');
    add(m,15,'expense',r(140000,260000,1000),'e5','a3','Цахилгаан, дулаан, ус');
    for(let i=0;i<8;i++)add(m,day(),'expense',r(28000,135000),'e0',pick(['a2','a2','a4','a1']),['Номин супермаркет','E-Mart','Хүнсний дэлгүүр','Мах, сүү'][i%4]);
    for(let i=0;i<6;i++)add(m,day(),'expense',r(12000,58000),'e1',pick(['a2','a5','a1']),['Кофе','Үдийн хоол','Найзуудтай оройн хоол'][i%3]);
    for(let i=0;i<7;i++)add(m,day(),'expense',r(2000,16000),'e2','a1',i%2?'Такси':'Автобус');
    for(let i=0;i<3;i++)add(m,day(),'expense',r(80000,140000,1000),'e3',pick(['a4','a2']),'АИ-92');
    if(rnd()<.7)add(m,day(),'expense',r(60000,320000,1000),'e8','a5','Хувцас');
    if(rnd()<.8)add(m,day(),'expense',r(25000,110000,1000),'e11','a5','Кино, тоглолт');
    add(m,day(),'expense',r(15000,90000,1000),'e7','a4','Эмийн сан');
    add(m,day(),'transfer',400000,null,'a2','АТМ-аас бэлэн мөнгө','a1');
    add(m,25,'transfer',r(250000,450000,10000),null,'a2','ХХБ картын төлбөр','a4');
    add(m,26,'transfer',r(200000,350000,10000),null,'a3','Голомт картын төлбөр','a5');
    add(m,28,'income',Math.round(4800000*0.11/12/100)*100,'i3','a6','Хадгаламжийн хүү');
    add(m,28,'income',Math.round(2500000*0.12/12/100)*100,'i3','a7','Хадгаламжийн хүү');
    add(m,28,'income',Math.round(1200000*0.10/12/100)*100,'i3','a8','Хадгаламжийн хүү');
  }
  const lend=(k,day,type,amount,accId,who)=>{const t=add(shiftM(cm,-k),day,type,amount,type==='expense'?'e15':'i5',accId,'');if(t)t.who=who};
  lend(2,10,'expense',300000,'a2','Бат');lend(1,12,'income',100000,'a2','Бат');lend(0,3,'income',50000,'a1','Бат');
  lend(2,18,'expense',200000,'a1','Дорж');lend(1,5,'income',200000,'a2','Дорж');
  lend(1,22,'expense',150000,'a3','Сараа');lend(0,1,'expense',80000,'a1','Ганаа');
  s.budgets={e0:700000,e1:220000,e2:90000,e3:330000,e8:200000,e11:120000,e5:250000};
  const st=shiftM(cm,-2);
  const rule=(type,amount,catId,accId,note,day,toAccId)=>({id:uid(),type,amount,catId:catId||null,accId,toAccId:toAccId||null,note,day,start:st,done:[]});
  s.recurring=[rule('income',3200000,'i0','a2','Сарын цалин',5),rule('expense',950000,'e4','a2','Байрны түрээс',3),
    rule('transfer',300000,null,'a2','Сар бүрийн хуримтлал',6,'a6'),rule('transfer',200000,null,'a3','Аяллын хуримтлал',20,'a7'),
    rule('transfer',100000,null,'a2','Яаралтай сан',7,'a8'),
    rule('expense',120000,'e12','a5','Фитнесийн сарын төлбөр',8),rule('expense',45000,'e6','a2','Утас + интернет',31)];
  applyRecurring(s);
  const mv=(k,amount)=>({date:shiftM(cm,-k)+'-07',amount});
  s.goals=[
    {id:uid(),name:'Машин авах',target:15000000,deadline:shiftM(cm,14),color:'#2B6CB0',moves:[mv(2,3600000),mv(1,300000),mv(0,300000)]},
    {id:uid(),name:'Солонгос аялал',target:3500000,deadline:shiftM(cm,7),color:'#B83280',moves:[mv(2,500000),mv(1,350000),mv(0,250000)]},
    {id:uid(),name:'Яаралтай сан (3 сарын зардал)',target:8000000,deadline:'',color:'#2F855A',moves:[mv(2,4800000)]}];
  return s;
}
/* ---------- local database: IndexedDB key-value, localStorage if IDB is unavailable ----------
   Keys: 'auth' → {token,user:{id,name},key} | null;  'data:<scope>' → S;  'sync:<scope>' → SY.
   scope = 'local' when signed out, 'u<id>' per account, so several people can share one phone. */
const store=(()=>{
  let db=null,dead=!('indexedDB' in window);
  try{if(localStorage.getItem('togrog.useLS'))dead=true}catch(e){}
  const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('togrog',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{db=r.result;db.onclose=()=>{db=null};db.onversionchange=()=>{db.close();db=null};res(db)};
    r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
  async function run(mode,fn){
    for(let i=0;;i++){
      try{const d=db||await open();return await new Promise((res,rej)=>{const t=d.transaction('kv',mode),rq=fn(t.objectStore('kv'));t.oncomplete=()=>res(rq.result);t.onerror=t.onabort=()=>rej(t.error)})}
      catch(e){db=null;if(i)throw e}  // iOS sometimes drops the IDB connection while the app is in the background: reopen once
    }
  }
  const ls={get:k=>{try{const v=localStorage.getItem('togrog.'+k);return v?JSON.parse(v):undefined}catch(e){}},
    set:(k,v)=>{try{localStorage.setItem('togrog.'+k,JSON.stringify(v))}catch(e){}},
    del:k=>{try{localStorage.removeItem('togrog.'+k)}catch(e){}}};
  const wrap=(name,mode,fn)=>async(k,v)=>{
    if(!dead)try{return await run(mode,s=>fn(s,k,v))}catch(e){dead=true;try{localStorage.setItem('togrog.useLS','1')}catch(_){}}
    return ls[name](k,v)};
  return {get:wrap('get','readonly',(s,k)=>s.get(k)),set:wrap('set','readwrite',(s,k,v)=>s.put(v,k)),del:wrap('del','readwrite',(s,k)=>s.delete(k))};
})();
const emptyState=()=>({v:1,sample:false,accounts:[],categories:[],tx:[],budgets:{},recurring:[],goals:[]});
const freshSync=()=>({base:{},outbox:{},cursor:0,last:0});
let auth=(await store.get('auth'))||null;
const scope=()=>auth?'u'+auth.user.id:'local';
let S=await store.get('data:'+scope()),SY=(auth&&await store.get('sync:'+scope()))||freshSync();
if(auth&&!S){S=emptyState();SY={...freshSync(),hold:true}}   // local copy lost (e.g. iOS evicted it): download before tracking anything
if(!S&&!auth){try{const raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);await store.set('data:local',S);localStorage.removeItem(KEY)}}catch(e){}}  // v1.2 kept everything in localStorage
if(!S||!Array.isArray(S.tx))S=sample();
function migrate(){S.budgets=S.budgets||{};S.recurring=S.recurring||[];S.goals=S.goals||[];S.accounts=S.accounts||[];S.categories=S.categories||[];
  if(!S.loanCats&&S.categories.length){for(const c of LOAN_CATS())if(!S.categories.some(x=>x.id===c.id))S.categories.push(c);S.loanCats=1}}  // v1.3: once, so a deleted loan category stays deleted
migrate();

/* ---------- sync ----------
   Every record (account, category, tx, rule, goal, budget, prefs) is a key 'coll/id'. save() diffs S against
   SY.base (hash per key) and puts changed/deleted keys in SY.outbox with the edit time. sync() pushes the outbox
   encrypted, pulls everything newer than SY.cursor, and resolves conflicts per record: newest edit wins.
   iOS has no Background Sync, so sync runs on open, on return to the app, when back online, every minute while
   visible, a moment after each change, and as a keepalive request when the app is hidden. */
const API='api/index.php';
const COLL={acc:'accounts',cat:'categories',tx:'tx',rec:'recurring',goal:'goals'};
function recs(st){const o={};
  for(const c in COLL)for(const x of st[COLL[c]]||[])o[c+'/'+x.id]=x;
  for(const id in st.budgets||{})o['bud/'+id]={v:st.budgets[id]};
  o['meta/prefs']={sample:!!st.sample,smsSeen:st.smsSeen||[],loanCats:!!st.loanCats};return o}
const hash=s=>{let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^h1>>>16,2246822507)^Math.imul(h2^h2>>>13,3266489909);h2=Math.imul(h2^h2>>>16,2246822507)^Math.imul(h1^h1>>>13,3266489909);return(h2>>>0).toString(36)+(h1>>>0).toString(36)};
function track(){const now=Date.now(),r=recs(S),b=SY.base,ob=SY.outbox;
  for(const k in r){const h=hash(JSON.stringify(r[k]));if(b[k]!==h){b[k]=h;ob[k]=now}}
  for(const k in b)if(!(k in r)){delete b[k];ob[k]=now}}
const pending=()=>Object.keys(SY.outbox).length;
const bc='BroadcastChannel' in window?new BroadcastChannel('togrog'):null;
const bcPost=m=>{try{bc&&bc.postMessage(m)}catch(e){}};
function persist(){const sc=scope();
  return Promise.all([store.set('data:'+sc,S),auth?store.set('sync:'+sc,SY):0,store.set('auth',auth)]).then(()=>bcPost(sc),()=>{})}
function save(){if(auth&&!SY.hold)track();persist();if(auth&&pending())syncSoon();syncUI()}

/* End-to-end encryption: PBKDF2(password, username) → 512 bits. First half is the login secret sent to the
   server; second half is the AES-GCM key that never leaves the device. The server stores only ciphertext. */
const te=new TextEncoder(),td=new TextDecoder();
const b64=u=>{let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKeys(name,pass){
  if(!(window.crypto&&crypto.subtle))throw Object.assign(new Error(),{msg:'Аюулгүй холболт (HTTPS) шаардлагатай.'});
  const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:te.encode('togrog/v1/'+name),iterations:310000,hash:'SHA-256'},base,512));
  return {auth:b64(bits.slice(0,32)),key:b64(bits.slice(32))};
}
let aesKey=null;
const getKey=async()=>aesKey||(aesKey=await crypto.subtle.importKey('raw',unb64(auth.key),'AES-GCM',false,['encrypt','decrypt']));
async function seal(k,d){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:te.encode(k)},await getKey(),te.encode(JSON.stringify(d))));
  const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64(o)}
async function open_(k,s){const b=unb64(s);
  return JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12),additionalData:te.encode(k)},await getKey(),b.slice(12))))}

async function api(a,body,opt={}){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),opt.timeout||20000);  // iOS navigator.onLine is unreliable: just try, with a timeout
  try{
    const r=await fetch(API+'?a='+a,{method:'POST',cache:'no-store',keepalive:!!opt.keepalive,signal:ctl.signal,
      headers:{'Content-Type':'application/json',...(auth?{'X-Token':auth.token}:{})},body:JSON.stringify(body||{})});
    let j=null;try{j=await r.json()}catch(_){}
    if(!r.ok||!j)throw Object.assign(new Error('HTTP '+r.status),{status:r.status,msg:j&&j.error});
    return j;
  }finally{clearTimeout(tm)}
}
/* Apply pulled records to S. A local edit newer than the server copy wins and stays in the outbox. */
async function applyRemote(list){
  const idx={},touched=[];
  for(const x of list){
    const ou=SY.outbox[x.k];if(ou&&ou>x.u)continue;
    let d=null;if(!x.del&&x.d)try{d=await open_(x.k,x.d)}catch(e){continue}  // unreadable record: skip rather than block sync
    delete SY.outbox[x.k];
    const i=x.k.indexOf('/'),c=x.k.slice(0,i),id=x.k.slice(i+1);
    if(c==='bud'){if(d)S.budgets[id]=d.v;else delete S.budgets[id]}
    else if(c==='meta'){if(id==='prefs'&&d){S.sample=!!d.sample;S.smsSeen=d.smsSeen||[];S.loanCats=!!d.loanCats}}

async function syncRun(opt){
  const sc=scope();let changed=0,more=true;
  for(let g=0;more&&g<100;g++){
    const r=recs(S),keys=Object.keys(SY.outbox).slice(0,opt.keepalive?40:300);
    const changes=await Promise.all(keys.map(async k=>k in r?{k,u:SY.outbox[k],d:await seal(k,r[k])}:{k,u:SY.outbox[k],del:1}));
    const res=await api('sync',{cursor:SY.cursor,changes},opt);
    if(scope()!==sc)return;  // signed out meanwhile
    for(const c of changes)if(SY.outbox[c.k]===c.u)delete SY.outbox[c.k];
    changed+=await applyRemote(res.records||[]);
    SY.cursor=res.cursor;
    more=res.more||(!opt.keepalive&&pending()>0);
  }

  if(changed){save();render()}else persist();
}
function sync(opt){

      syncErr=e.status===401?'auth':'off';if(e.status===401){auth.expired=true;persist()}return false})
    .finally(()=>{syncing=null;syncUI();if(again){again=false;syncSoon(300)}});
  syncUI();return syncing;
}

  const prev={auth,S,SY,aesKey},a={token:res.token,user:res.user,key:k.key},sc='u'+a.user.id;
  auth=a;aesKey=null;syncErr='';

    for(const it of items){const len=it.v/exp*C;segs+=`<circle r="${r}" cx="70" cy="70" fill="none" stroke="${it.c.color}" stroke-width="20" stroke-dasharray="${Math.max(len-1.2,.3)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len}

  const mx=niceMax(Math.max(1,...ms.flatMap(x=>[x.inc,x.exp])));
  const y=v=>pt+ph*(1-v/mx);const cw=(W-pl-6)/ms.length,bw=Math.min(16,cw/3);

  for(const f of [0,.5,1]){const v=mx*f;svg+=`<line class="g" x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text class="lb" x="${pl-6}" y="${y(v)+3}" text-anchor="end">${compact(v)}</text>`}

    <div><small>Хуримтлалын хувь</small><b class="num ${rate!==null&&rate<0?'exp':'inc'}">${rate===null?'—':rate+'%'}</b></div>
    <div><small>6 сарын дундаж зарлага</small><b class="num">${fmt(avgExp)}</b></div>

  const titles={set:'Нууц код тохируулах',change:'Нууц код солих',remove:'Нууц код устгах'};
  const subs={set:'Шинэ 4 оронтой нууц код оруулна уу',change:'Одоогийн кодоо оруулна уу',remove:'Одоогийн кодоо оруулна уу'};
  openSheet(`<h3>${titles[mode]}</h3>
    <p class="muted" id="ps-sub" style="margin:0 0 6px">${subs[mode]}</p>
    <div class="lk-dots" id="ps-dots" style="justify-content:center;margin:4px 0 0">${[0,1,2,3].map(()=>'<span class="lk-dot"></span>').join('')}</div>
    <p class="lk-msg" id="ps-msg"></p>
    <div class="lk-pad" style="margin:0 auto">${lkPadHTML('ps')}</div>
    <button class="btn full" data-act="close" style="margin-top:6px">Болих</button>`);
}
async function psNext(){
  const ps=pinSetState;if(!ps)return;
  if(ps.phase==='old'){
    const h=await pinHashFn(pinSetBuf);pinSetBuf='';
    if(h!==pinStored()){
      lkDots('ps','',true);
      const dots=document.getElementById('ps-dots');
      if(dots){dots.classList.remove('lk-shake');void dots.offsetWidth;dots.classList.add('lk-shake')}
      const msg=document.getElementById('ps-msg');if(msg){msg.textContent='Буруу код';msg.style.color='var(--danger)'}
      setTimeout(()=>lkDots('ps','',false),600);return;
    }
    if(ps.mode==='remove'){
      try{localStorage.removeItem('togrog.pin')}catch(e){}
      closeSheet();toast('Нууц код устгагдлаа');if(tab==='prefs')render();return;
    }
    ps.phase='new';pinSetBuf='';
    const sub=document.getElementById('ps-sub');if(sub)sub.textContent='Шинэ 4 оронтой нууц код оруулна уу';
    const msg=document.getElementById('ps-msg');if(msg)msg.textContent='';
    lkDots('ps','',false);return;
  }
  if(ps.phase==='new'){ps.first=pinSetBuf;ps.phase='confirm';pinSetBuf='';
    const sub=document.getElementById('ps-sub');if(sub)sub.textContent='Кодыг дахин оруулж баталгаажуулна уу';
    lkDots('ps','',false);return;
  }
  if(ps.phase==='confirm'){
    if(pinSetBuf!==ps.first){
      ps.phase='new';ps.first='';pinSetBuf='';lkDots('ps','',true);
      const dots=document.getElementById('ps-dots');
      if(dots){dots.classList.remove('lk-shake');void dots.offsetWidth;dots.classList.add('lk-shake')}
      const sub=document.getElementById('ps-sub');if(sub)sub.textContent='Таарсангүй. Дахин оруулна уу';
      setTimeout(()=>lkDots('ps','',false),600);return;
    }
    const h=await pinHashFn(pinSetBuf);
    try{localStorage.setItem('togrog.pin',h)}catch(e){}
    closeSheet();toast('Нууц код тохируулагдлаа');if(tab==='prefs')render();
  }
}

function saveTx(){
  readDraft();const d=draft,err=$('#f-err');
  if(!(d.amount>0))return err.textContent='Дүнгээ оруулна уу.';
  if(d.type!=='transfer'&&!d.catId)return err.textContent='Ангилал сонгоно уу.';
  if(d.type==='transfer'&&d.accId===d.toAccId)return err.textContent='Өөр данс руу шилжүүлнэ үү.';
  if(!d.date)return err.textContent='Огноо сонгоно уу.';
  const lc=d.type!=='transfer'&&loanCat(d.catId);
  if(lc&&!d.who)return err.textContent=lc==='out'?'Хэнд зээлдүүлснээ бичнэ үү.':'Хэнээс буцаан авснаа бичнэ үү.';
  const rec={id:d.id,type:d.type,amount:d.amount,date:d.date,catId:d.type==='transfer'?null:d.catId,accId:d.accId,toAccId:d.type==='transfer'?d.toAccId:null,note:d.note,ts:Date.now()};
  if(d.recId)rec.recId=d.recId;
  if(lc)rec.who=d.who;
  const i=S.tx.findIndex(t=>t.id===d.id);
  let extra=0;
  if(i<0&&d.repeat){
    const r={id:uid(),type:rec.type,amount:rec.amount,catId:rec.catId,accId:rec.accId,toAccId:rec.toAccId,note:rec.note,day:Number(rec.date.slice(8)),start:ym(rec.date),done:[ym(rec.date)]};
    S.recurring.push(r);rec.recId=r.id;
  }
  if(i>=0)S.tx[i]=rec;else S.tx.push(rec);
  if(i<0&&d.repeat)extra=applyRecurring(S);
  save();closeSheet();cur=ym(rec.date);render();toast(i>=0?'Хадгаллаа':d.repeat?`Нэмлээ · сар бүрийн ${Number(rec.date.slice(8))}-нд давтагдана${extra?` (өмнөх ${extra} сарыг нөхөж бүртгэв)`:''}`:'Нэмлээ');
}

function goalMove(sign){

}

const hashStr=s=>{let h=5381;for(const ch of s.replace(/\s+/g,' ').trim().toLowerCase())h=(h*33^ch.charCodeAt(0))>>>0;return h.toString(36)};
function smsOne(raw){
  const t=raw.replace(/\s+/g,' ').trim(),low=t.toLowerCase();
  const re=/([+\-−]?)\s?(\d{1,3}(?:[ ,'’]\d{3})+|\d{3,})(?:[.,]\d{1,2})?\s?(mnt|₮|төг|tug|tgr|төгрөг)?/gi;
  let m,amount=0,sign='';
  while((m=re.exec(t))){
    const before=low.slice(Math.max(0,m.index-22),m.index);
    if(/үлд|uld|balance|bal[.:]|бал\./.test(before))continue;
    const hasCur=!!m[3],hasKey=/дүн|dun|amount|орлого|orlogo|зарлага|zarlaga|гүйлгээ|guilgee|[+\-−]\s?$/.test(before)||m[1];
    if(!hasCur&&!hasKey)continue;
    const n=Number(m[2].replace(/[^\d]/g,''));if(n<=0)continue;
    if(/^(19|20)\d{2}$/.test(m[2])&&!hasCur)continue;
    amount=n;sign=m[1];break;
  }
  if(!amount)return{raw,error:true};
  let type='expense';
  if(sign==='+'||/орлого|orlogo|орсон|orson|credit|хүлээн ав|huleen av|орж ирсэн|nemegdsen|нэмэгдсэн|цалин|tsalin/.test(low))type='income';
  if(sign==='-'||sign==='−'||/зарлага|zarlaga|гарсан|garsan|debit|хасагд|hasagd|худалдан ав|purchase|pos |төлбөр төлсөн|tulbur/.test(low))type='expense';
  let date=today();
  let d=t.match(/(20\d{2})[.\/\-](\d{1,2})[.\/\-](\d{1,2})/);
  if(d)date=d[1]+'-'+d[2].padStart(2,'0')+'-'+d[3].padStart(2,'0');
  else if((d=t.match(/\b(\d{1,2})[.\/\-](\d{1,2})[.\/\-](20\d{2})\b/)))date=d[3]+'-'+d[2].padStart(2,'0')+'-'+d[1].padStart(2,'0');
  else if((d=t.match(/\b(\d{2})[.\/](\d{1,2})[.\/](\d{1,2})\b/)))date='20'+d[1]+'-'+d[2].padStart(2,'0')+'-'+d[3].padStart(2,'0');
  if(!/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(date)||date>today())date=today();
  let note='';
  const nm=t.match(/(?:гүйлгээний утга|guilgeenii utga|утга|utga|тайлбар|tailbar|description|desc|merchant|байршил|at)\s*[:\-]\s*(.+?)(?=\s*(?:[;|]|үлдэгдэл|uldegdel|balance|огноо|ognoo|$))/i);
  if(nm)note=nm[1].replace(/[.,]+$/,'').trim().slice(0,60);
  if(!note){const pm=t.match(/\b(?:pos|худалдан авалт|purchase)\s*[:\-]?\s*([A-Za-zА-Яа-яӨөҮүЁё&' .\-]{3,40}?)(?=\s+\d|\s+(?:bal|үлд|uld)|[.;]|$)/i);if(pm)note=pm[1].trim()}
  let accId='';
  const bank=BANK_LIST.find(b=>b.rx.test(low));
  if(bank){const a=S.accounts.find(a=>a.bank===bank.id)||S.accounts.find(a=>a.name.toLowerCase().includes(bank.key));if(a)accId=a.id}
  if(!accId){const a=S.accounts.find(a=>a.type==='bank')||S.accounts[0];accId=a&&a.id}
  let catId=null;const hay=(note+' '+low);
  if(note){const past=sorted(S.tx).find(x=>x.type===type&&x.note&&x.catId&&(x.note.toLowerCase().includes(note.toLowerCase())||note.toLowerCase().includes(x.note.toLowerCase())));if(past)catId=past.catId}
  if(!catId)for(const[rx,cid]of CAT_HINTS){const c=S.categories.find(c=>c.id===cid);if(c&&c.kind===type&&rx.test(hay)){catId=cid;break}}
  if(!catId){const fb=S.categories.filter(c=>c.kind===type);catId=(fb.find(c=>/бусад/i.test(c.name))||fb[0]||{}).id||null}
  const h=hashStr(t);
  const dup=(S.smsSeen||[]).includes(h)||S.tx.some(x=>x.type===type&&x.amount===amount&&x.date===date);
  return{raw,amount,type,date,note,accId,catId,h,dup};
}
function smsSplit(text){
  let parts=text.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(parts.length===1){const lines=parts[0].split(/\n/).map(s=>s.trim()).filter(Boolean);
    if(lines.length>1&&lines.every(l=>/\d{3}/.test(l)&&/(mnt|₮|төг|дүн|dun)/i.test(l)))parts=lines}
  return parts;
}

function smsCommit(){
  let n=0;const seen=S.smsSeen||(S.smsSeen=[]);let lastDate='';
  smsItems.forEach((it,i)=>{

    if(!seen.includes(it.h))seen.push(it.h);n++;lastDate=date;
  });
  if(!n)return $('#f-err').textContent='Нэмэх гүйлгээгээ сонгоно уу.';
  if(seen.length>500)seen.splice(0,seen.length-500);

  if(f==='acc-form'){const n=$('#f-name').value.trim();if(!n)return $('#f-err').textContent='Нэр оруулна уу.';
    const a={id:draft.id,name:n,type:$('#f-type').value,initial:parseAmt($('#f-init').value)};const bk=$('#f-bank').value;if(bk)a.bank=bk;
    const i=S.accounts.findIndex(x=>x.id===a.id);if(i>=0)S.accounts[i]=a;else S.accounts.push(a);save();closeSheet();render();return}
  if(f==='cat-form'){const n=$('#f-name').value.trim();if(!n)return $('#f-err').textContent='Нэр оруулна уу.';
    const c={id:draft.id,name:n,kind:draft.kind,color:draft.color};const i=S.categories.findIndex(x=>x.id===c.id);if(i>=0)S.categories[i]=c;else S.categories.push(c);save();closeSheet();render();return}
  if(f==='rec-form'){const r=S.recurring.find(x=>x.id===draft.id);const v=parseAmt($('#f-amount').value),day=Math.round(+$('#f-day').value);
    if(!(v>0))return $('#f-err').textContent='Дүнгээ оруулна уу.';if(!(day>=1&&day<=31))return $('#f-err').textContent='Өдрийг 1–31 хооронд оруулна уу.';
    if(r){r.amount=v;r.day=day;r.accId=$('#f-acc').value;r.note=$('#f-note').value.trim();applyRecurring(S)}save();closeSheet();render();toast('Давталт хадгаллаа');return}
  if(f==='goal-form'){const n=$('#f-name').value.trim(),t=parseAmt($('#f-amount').value);
    if(!n)return $('#f-err').textContent='Нэр оруулна уу.';if(!(t>0))return $('#f-err').textContent='Зорилтот дүнгээ оруулна уу.';
    const g={id:draft.id,name:n,target:t,deadline:$('#f-deadline').value||'',color:draft.color,moves:draft.moves||[]};
    const init=$('#f-init')?parseAmt($('#f-init').value):0;if(init>0)g.moves.push({date:today(),amount:init});
    const i=S.goals.findIndex(x=>x.id===g.id);if(i>=0)S.goals[i]=g;else S.goals.push(g);save();closeSheet();render();toast('Зорилго хадгаллаа');return}
  if(f==='move-form')return goalMove(1);
  if(f==='sms-form')return smsParse();
  if(f==='smsok-form')return smsCommit();
  if(f==='bud-form'){const v=parseAmt($('#f-amount').value);if(v>0)S.budgets[draft.id]=v;else delete S.budgets[draft.id];save();closeSheet();render();toast('Төсөв хадгаллаа')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-amount'||t.id==='f-init'){const n=parseAmt(t.value);t.value=n?grp(n):''}
  if(t.id==='f-q'){q=t.value;const pos=t.selectionStart;render();const n=$('#f-q');n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}
});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scrim').hidden)closeSheet()});
$('#f-import').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(r.result);r.readAsText(f);e.target.value=''});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(tab==='prefs')render()});
window.addEventListener('hashchange',route);
document.addEventListener('change',e=>{  // account sheet: picking a bank fills the name until the user types their own
  if(e.target.id!=='f-bank'&&e.target.id!=='f-type')return;
  const tp=$('#f-type'),bk=$('#f-bank'),nm=$('#f-name');if(!bk||!nm)return;
  if(e.target.id==='f-bank'&&bk.value&&tp.value==='cash')tp.value='bank';
  const b=BANK_LIST.find(x=>x.id===bk.value);
  if(b&&(!nm.value.trim()||nm.value===draft._auto)){nm.value=draft._auto=bankAccName(b,tp.value)}});
document.addEventListener('change',e=>{const i=e.target.dataset&&e.target.dataset.smsType;if(i===undefined)return;const type=e.target.value,it=smsItems[+i];
  const sel=$('#s-cat-'+i);const opts=S.categories.filter(c=>c.kind===type);sel.innerHTML=opts.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const lbl=$('#s-lbl-'+i);lbl.className='sms-amt num '+(type==='income'?'inc':'exp');lbl.textContent=(type==='income'?'+':'−')+grp(it.amount)+'₮'});
let swReg=null;
function catchUp(){if(!$('#scrim').hidden)return;const n=applyRecurring(S);if(n){save();render();toast(n+' давтагдах гүйлгээ бүртгэгдлээ')}}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){
    if(pinStored()&&!locked&&Date.now()-lkHiddenAt>LK_TIMEOUT)showLock();
    sync().finally(catchUp);if(swReg)swReg.update().catch(()=>{})
  }else{lkHiddenAt=Date.now();if(auth&&pending())sync({keepalive:true})}
});
window.addEventListener('pagehide',()=>{lkHiddenAt=Date.now();if(auth&&pending()&&!syncing)sync({keepalive:true})});
window.addEventListener('online',()=>sync());
setInterval(()=>{if(document.visibilityState==='visible')sync()},60000);
if(bc)bc.onmessage=async e=>{  // another tab changed data or signed in/out
  if(e.data==='auth')return location.reload();
  if(e.data!==scope())return;
  const s=await store.get('data:'+scope());if(s){S=s;migrate()}
  if(auth){const y=await store.get('sync:'+scope());if(y)SY=y}
  render();syncUI()};
if(pinStored())showLock();
route();
try{const sp=new URLSearchParams(location.search);const shared=[sp.get('title'),sp.get('text')].filter(Boolean).join('\n');
  if(shared){history.replaceState(null,'',location.pathname+'#txs');tab='txs';render();smsSheet(shared)}}catch(_){}
if(genOnLoad&&!S.sample)toast(genOnLoad+' давтагдах гүйлгээ бүртгэгдлээ');
syncUI();
if(auth)sync().finally(catchUp);
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});  // ask the browser not to evict our data
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(r=>{swReg=r},()=>{})}
})();
</script>

</body>
</html>
