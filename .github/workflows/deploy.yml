# Push to main → build → upload to Hostinger over FTP.
# Settings → Secrets and variables → Actions:
#   secrets: FTP_SERVER (e.g. ftp.example.com or the IP from hPanel → FTP Accounts), FTP_USERNAME, FTP_PASSWORD
#   variable (optional): FTP_DIR — remote folder, must end with "/" (default "public_html/")
name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index.html, manifest, icons from src.html
        run: pip install pillow && python tools/build.py

      - name: Syntax check
        run: |
          node -e "const h=require('fs').readFileSync('index.html','utf8');new Function(h.split('<script>')[1].split('</script>')[0]);console.log('js ok')"
          php -l api/index.php

      - name: Stamp service worker with commit (forces a fresh app cache on every deploy)
        run: sed -i "s/const BUILD='dev'/const BUILD='${GITHUB_SHA::7}'/" sw.js && grep -n "const BUILD" sw.js

      - name: Upload over FTP (only changed files)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            src.html
            tools/**
            CLAUDE.md
            README.md
            api/config.php
